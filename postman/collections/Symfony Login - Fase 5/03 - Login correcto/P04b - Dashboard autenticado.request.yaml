$kind: http-request
url: "{{baseUrl}}/dashboard"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test('P04b - Dashboard accesible', () => {\r

      \    pm.response.to.have.status(200);\r

      \    pm.expect(pm.response.text()).to.include('Bienvenido');\r

      });\r

      \r

      pm.test('P04b - Muestra el usuario', () => {\r

      \    const username = pm.environment.get('username');\r

      \    pm.expect(pm.response.text()).to.include(username);\r

      });"
    language: text/javascript
order: 2000
