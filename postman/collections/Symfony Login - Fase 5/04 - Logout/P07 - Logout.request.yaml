$kind: http-request
url: "{{baseUrl}}/logout"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test('P07 - Logout redirige a home', () => {\r

      \    pm.response.to.have.status(302);\r

      \    const location = pm.response.headers.get('Location');\r

      \    pm.expect(new URL(location).pathname).to.eql('/');\r

      });"
    language: text/javascript
settings:
  followRedirects: false
order: 1000
