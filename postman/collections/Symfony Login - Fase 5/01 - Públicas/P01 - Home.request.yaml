$kind: http-request
url: "{{baseUrl}}/"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test('P01 - 200 OK', () => {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test('P01 - Página de inicio', () => {\r

      \    pm.expect(pm.response.text()).to.include('Bienvenido a mi primera aplicación Symfony');\r

      }); "
    language: text/javascript
order: 1000
