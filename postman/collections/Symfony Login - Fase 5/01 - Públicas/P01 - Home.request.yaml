$kind: http-request
url: "{{baseUrl}}/"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test('P01 - 200 OK', () => {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test('P01 - Página de inicio', () => {\r

      \    const h1 = (pm.response.text().match(/<h1[^>]*>(.*?)<[/]h1>/) || [])[1] || '';\r

      \r

      \    const text = h1.replace(/<[^>]+>/g, '').replace(/\\s+/g, ' ').trim();\r

      \r

      \    pm.expect(text).to.include('Bienvenido a mi primera aplicación Symfony');\r

      }); "
    language: text/javascript
order: 1000
