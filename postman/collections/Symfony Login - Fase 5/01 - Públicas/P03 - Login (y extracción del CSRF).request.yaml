$kind: http-request
url: "{{baseUrl}}/login"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test('P03 - 200 OK', () => {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      const html = pm.response.text();\r

      \r

      pm.test('P03 - Formulario completo', () => {\r

      \    pm.expect(html).to.include('name=\"_username\"');\r

      \    pm.expect(html).to.include('name=\"_password\"');\r

      \    pm.expect(html).to.include('name=\"_csrf_token\"');\r

      });\r

      \r

      // Guarda el token para el POST /login\r

      const match = html.match(/name=\"_csrf_token\"[\\s\\S]*?value=\"([^\"]+)\"/);\r

      \r

      pm.test('P03 - Token CSRF extraído', () => {\r

      \    pm.expect(match, 'No se encontró _csrf_token en el HTML').to.not.be.null;\r

      });\r

      \r

      pm.collectionVariables.set('csrf_token', match ? match[1] : '');"
    language: text/javascript
order: 3000
